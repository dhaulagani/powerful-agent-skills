name: Daily Autonomous Trending Agent Skills Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: sync-agent-skills
  cancel-in-progress: false

jobs:
  sync-leaderboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh Star Counts & Verify Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, urllib.request, os
          with open('registry.json') as f:
              skills = json.load(f)
          token = os.environ.get('GITHUB_TOKEN')
          headers = {'User-Agent': 'Agent-Skills-Sync/1.0'}
          if token:
              headers['Authorization'] = f'Bearer {token}'
          for s in skills:
              repo = s.get('repo')
              if not repo:
                  continue
              try:
                  req = urllib.request.Request(f'https://api.github.com/repos/{repo}', headers=headers)
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      d = json.loads(resp.read().decode('utf-8'))
                      stars = d.get('stargazers_count', s['stars_count'])
                      s['stars_count'] = stars
                      s['stars_str'] = f'{int(stars/1000)}K+'
              except Exception:
                  pass
          skills.sort(key=lambda x: x['stars_count'], reverse=True)
          for idx, s in enumerate(skills, 1):
              s['rank'] = idx
          with open('registry.json', 'w') as f:
              json.dump(skills, f, indent=2)
          "

      - name: Commit & Push Daily Trending Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(skills): autonomous daily star ranking refresh [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in registry.json, skipping commit."
          fi
